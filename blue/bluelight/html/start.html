<script>
  window.addEventListener('load', function() {
    const urlParams = new URLSearchParams(window.location.search);
    
    // 1. Setup Profile
    const userName = urlParams.get('userName') || "Dr.Mohammad";
    const userAvatar = urlParams.get('userAvatar') || "http://localhost:5173/assets/images/doctor_avatar.jpg";
    const profileContainer = document.getElementById('dicom-header-profile');
    if (profileContainer) {
      profileContainer.innerHTML = `
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="display: flex; flex-direction: column; align-items: flex-end;">
            <span style="font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; color: #a1a1aa;">Radiologist</span>
            <span style="font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; color: #f4f4f5;">${userName}</span>
          </div>
          <img src="${userAvatar}" alt="${userName}" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #52525b; background: #3f3f46;" />
        </div>
      `;
    }

    // 2. Load DICOM Case
    const caseId = urlParams.get('loadCaseId');
    if (caseId) {
      console.log("Loading DICOM file from API for case: ", caseId);
      ImageManager.NumOfPreLoadSops += 1;
      fetch(`http://127.0.0.1:8000/api/cases/${caseId}/file`)
        .then(response => {
          if (!response.ok) throw new Error("DICOM file not found");
          return response.arrayBuffer();
        })
        .then(arrayBuffer => {
          var url = `case_${caseId}.dcm`;
          var Sop = loadDicomDataSet(arrayBuffer, false, url, true);
          if (Sop) {
            Sop.Image.url = url;
            setAllSeriesCount();
            ImageManager.preLoadSops.push({
              dataSet: Sop.dataSet, 
              image: Sop.Image, 
              Sop: Sop, 
              SeriesInstanceUID: Sop.Image.SeriesInstanceUID,
              Index: Sop.Image.NumberOfFrames | Sop.Image.InstanceNumber
            });
          }
          ImageManager.NumOfPreLoadSops -= 1;
          if (ImageManager.NumOfPreLoadSops == 0) {
            ImageManager.loadPreLoadSops();
            setTimeout(loadRestImageData, 1000);
          }
        })
        .catch(err => {
          console.error("Error loading case DICOM:", err);
          if (ImageManager.NumOfPreLoadSops >= 1) ImageManager.NumOfPreLoadSops -= 1;
        });
    }
  });
</script>
