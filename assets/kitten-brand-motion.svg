<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C10" />
      <stop offset="50%" stop-color="#12151D" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <!-- Burgundy Ambient Core Glow -->
    <radialGradient id="burgundy-radial" cx="28%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#8D321F" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#8D321F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Telemetry Glow -->
    <radialGradient id="emerald-radial" cx="85%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#00BF63" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#00BF63" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- High-Luminance Light Sweep Gradient -->
    <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="48%" stop-color="#FFE0DA" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="52%" stop-color="#E1998C" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- ECG Gradient -->
    <linearGradient id="ecg-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8D321F" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#8D321F" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#00BF63" stop-opacity="1" />
      <stop offset="75%" stop-color="#E1998C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#8D321F" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter for Waveform & Pulse -->
    <filter id="ecg-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Technical Grid -->
    <pattern id="telemetry-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
    </pattern>

