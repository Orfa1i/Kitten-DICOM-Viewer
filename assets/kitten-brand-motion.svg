  <style>
    @keyframes sheenSweep {
      0% { transform: translateX(-350px); }
      45%, 100% { transform: translateX(520px); }
    }
    @keyframes traceEcg {
      0% { stroke-dashoffset: 1400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeFade {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .ecg-path {
      stroke-dasharray: 280 40;
      animation: traceEcg 3.2s linear infinite;
    }
    .sheen-anim {
      animation: sheenSweep 3.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .telemetry-pill {
      animation: badgeFade 2.5s ease-in-out infinite;
    }
  </style>

